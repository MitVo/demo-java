name: Maven Java Semantic Release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' ##modificar por una variable de entorno u otra configuracion
          distribution: 'temurin'
      - name: Test with maven
        run: mvn clean test
  build:
    needs: test
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' ##modificar por una variable de entorno u otra configuracion
          distribution: 'temurin'

      - name: Build with maven
        run: mvn clean package

      - name: Get JAR file name
        id: get-jar
        run: |
          JAR_NAME=$(ls target/*.jar | head -n 1)
          echo "JAR_NAME=${JAR_NAME}" >> $GITHUB_ENV
          echo "{name}=${JAR_NAME}" >> $GITHUB_OUTPUT
      ## This should go to jfrog
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-java-app
          path: ${{ env.JAR_NAME }}

  super-linter:
    needs: build
    runs-on: ubuntu-latest

    name: super-linter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for Super-Linter to function properly
          fetch-tags: true
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint and setting commitlint configuration
        run: |
          npm install -g @commitlint/{cli,commitlint-config-gitmoji}
          echo "module.exports = {extends: ['gitmoji'],};" > commitlint.config.js 

      - name: Run Super Linter
        id: super-linter
        uses: super-linter/super-linter@v8.1.0
        env:
          ENABLE_COMMITLINT_STRICT_MODE: true
          VALIDATE_GIT_COMMITLINT: true
          ENFORCE_COMMITLINT_CONFIGURATION_CHECK: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  semantic-release:
    needs: [super-linter]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract repository name
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "REPO_NAME=${REPO_NAME}" >> $GITHUB_ENV 

      - name: Semantic Release Custom Action
        uses: MitVo/semantic-release-action@main
        if : steps.super-linter.outputs.lint-status == 'success'
        env:
          REPO_NAME: ${{ env.REPO_NAME }}
          #RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          release_branch: develop
          github_token: ${{ secrets.GITHUB_TOKEN }}
          #release_tag: ${{ env.RELEASE_TAG }}